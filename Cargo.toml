[package]
name = "swh_resolver"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
anyhow = "1.0.99"
arrow = "56.1.0"
clap = "4.5.47"
crossbeam-channel = "0.5.15"
dashmap = "6.1.0"
hashbrown = { version = "0.16", features = ["rayon"] }
hex = "0.4.3"
parquet = { version = "56.1.0", features = ["arrow"] }
rayon = "1.11.0"
sha1 = "0.10.6"
swh-graph = "8.0.4"
webgraph = "0.3.0"
sux = "0.7"
epserde = "0.8"

[profile.profiling]
inherits = "release"
debug = true
